# ============================================
# SimpleRAG - 前端容器 Nginx 配置
# 作用：容器内 Nginx，仅负责托管前端静态文件
# 宿主机 Nginx 将 / 转发至此服务（端口 3000）
# SPA 单页应用需 try_files 回退到 index.html
# ============================================
server {
    listen 80;
    server_name localhost;
    charset utf-8;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
